openapi: 3.0.3
info:
  title: BrightPath School Management API
  version: 1.0.0
  description: Local MVP API. Protected endpoints use JWT bearer authentication.
servers:
  - url: http://localhost:5000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Request could not be completed. }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AccountRegistrationRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        phone: { type: string, maxLength: 30 }
        role: { type: string, enum: [ADMIN, TEACHER, GUARDIAN, STUDENT] }
    AttendanceRequest:
      type: object
      required: [studentId, date, session, status]
      properties:
        studentId: { type: string }
        date: { type: string, format: date }
        session: { type: string, enum: [MORNING, AFTERNOON] }
        status: { type: string, enum: [PRESENT, ABSENT, LATE] }
    ExamRequest:
      type: object
      required: [title, classId, subjectId, examDate, maxMarks, passMarks]
      properties:
        title: { type: string }
        classId: { type: string }
        sectionId: { type: string, nullable: true }
        subjectId: { type: string }
        examDate: { type: string, format: date }
        maxMarks: { type: integer, minimum: 1 }
        passMarks: { type: integer, minimum: 0 }
        gradeRules:
          type: array
          items:
            type: object
            required: [grade, minPercent]
            properties:
              grade: { type: string }
              minPercent: { type: number, minimum: 0, maximum: 100 }
    FeePaymentRequest:
      type: object
      required: [amountCents]
      properties:
        amountCents: { type: integer, minimum: 1, description: Amount in paise }
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: API is running }
  /auth/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Token and role-bearing user profile }
        "400": { description: Missing email or password }
        "401": { description: Invalid credentials }
  /auth/register:
    post:
      summary: Public account registration
      description: Anyone can register. Student and guardian accounts need a school-record link before private records are available; teacher accounts need class assignments. Administrator signups are immediate outside production; production deployments require approval by an existing administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRegistrationRequest" }
      responses:
        "201": { description: Account and bearer token; includes administrator accounts outside production }
        "202": { description: Production administrator account request awaiting approval }
        "400": { description: Invalid registration fields }
        "409": { description: Email is already registered }
  /auth/requests:
    get:
      security: [{ bearerAuth: [] }]
      summary: List pending staff account requests (administrator)
      responses:
        "200": { description: Pending administrator and teacher requests }
        "403": { description: Administrator role required }
  /auth/requests/{userId}/approve:
    post:
      security: [{ bearerAuth: [] }]
      summary: Approve a pending staff account (administrator)
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Staff account activated }
        "403": { description: Administrator role required }
        "404": { description: Pending request not found }
  /auth/requests/{userId}/reject:
    post:
      security: [{ bearerAuth: [] }]
      summary: Reject a pending staff account (administrator)
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request rejected }
        "403": { description: Administrator role required }
        "404": { description: Pending request not found }
  /auth/unlinked-students:
    get:
      security: [{ bearerAuth: [] }]
      summary: List student accounts not linked to school records (administrator)
      responses:
        "200": { description: Unlinked student accounts }
        "403": { description: Administrator role required }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the active account
      responses:
        "200": { description: Current user's safe profile }
        "401": { description: Missing, invalid or inactive account }
  /guardians/{guardianId}/students:
    post:
      security: [{ bearerAuth: [] }]
      summary: Link a student to a guardian account (administrator)
      parameters:
        - in: path
          name: guardianId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId]
              properties:
                studentId: { type: string }
                relation: { type: string, enum: [Parent, Guardian, Other] }
      responses:
        "200": { description: Student linked; repeated requests safely update the relationship }
        "403": { description: Administrator role required }
        "404": { description: Guardian account or student not found }
  /students:
    get:
      security: [{ bearerAuth: [] }]
      summary: List students visible to the role
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Role-scoped student records }
        "401": { description: Authentication required }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create student (administrator)
      responses:
        "201": { description: Student created }
        "400": { description: Validation error }
        "409": { description: Duplicate admission number }
  /students/{id}/account:
    post:
      security: [{ bearerAuth: [] }]
      summary: Link a student login to a school record (administrator)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200": { description: Student login linked }
        "403": { description: Administrator role required }
        "409": { description: Student account already linked }
  /classes:
    get:
      security: [{ bearerAuth: [] }]
      summary: List classes and sections
      responses:
        "200": { description: Classes visible to the role }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create class (administrator)
      responses:
        "201": { description: Class created }
        "403": { description: Administrator role required }
  /classes/{classId}/sections:
    post:
      security: [{ bearerAuth: [] }]
      summary: Add section to a class (administrator)
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: string }
      responses:
        "201": { description: Section created }
        "404": { description: Class not found }
  /classes/{classId}/sections/{sectionId}/teachers:
    post:
      security: [{ bearerAuth: [] }]
      summary: Assign teacher to section (administrator)
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: string }
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        "201": { description: Teacher assignment created or refreshed }
        "400": { description: Section or teacher is invalid }
  /teachers:
    get:
      security: [{ bearerAuth: [] }]
      summary: List teachers (administrator)
      responses:
        "200": { description: Safe teacher profile fields }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create teacher and login account (administrator)
      responses:
        "201": { description: Teacher account created }
        "409": { description: Email or employee number already exists }
  /guardians:
    get:
      security: [{ bearerAuth: [] }]
      summary: List guardian and linked-student records (administrator)
      responses:
        "200": { description: Guardian list }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create guardian account and link a student (administrator)
      responses:
        "201": { description: Guardian created and linked }
        "400": { description: Invalid email, password or student }
  /attendance:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped attendance
      parameters:
        - in: query
          name: studentId
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: classId
          schema: { type: string }
      responses:
        "200": { description: Attendance rows }
    post:
      security: [{ bearerAuth: [] }]
      summary: Record attendance (administrator or assigned teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceRequest" }
      responses:
        "201": { description: Attendance recorded }
        "400": { description: Invalid date, session or status }
        "403": { description: Student is outside the teacher's assigned sections }
        "409": { description: Duplicate student/date/session }
  /attendance/summary:
    get:
      security: [{ bearerAuth: [] }]
      summary: Attendance totals for a date, class or student
      responses:
        "200": { description: Present, absent, late and rate totals }
  /subjects:
    get:
      security: [{ bearerAuth: [] }]
      summary: List subjects and class assignments
      responses:
        "200": { description: Subjects visible to the role }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a subject (administrator)
      responses:
        "201": { description: Subject created }
        "409": { description: Duplicate subject code }
  /subjects/assignments:
    post:
      security: [{ bearerAuth: [] }]
      summary: Assign subject to section (administrator)
      responses:
        "201": { description: Assignment saved }
        "400": { description: Invalid class, section, subject or teacher }
  /exams:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped exams
      responses:
        "200": { description: Exams with subject and class summary }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create exam (administrator or assigned teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamRequest" }
      responses:
        "201": { description: Exam created }
        "400": { description: Invalid exam, rules or subject assignment }
        "403": { description: Teacher is not assigned }
  /exams/{examId}/results:
    post:
      security: [{ bearerAuth: [] }]
      summary: Record or update a student's marks
      parameters:
        - in: path
          name: examId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Result and calculated grade }
        "400": { description: Marks invalid or student outside exam class }
        "403": { description: Teacher is not assigned }
  /exams/students/{studentId}/report-card:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read a student's report card (owner, linked guardian, assigned teacher or administrator)
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Results, totals and percentage }
        "403": { description: Student is outside the account's scope }
  /fees:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped fee invoices and ledger totals
      responses:
        "200": { description: Invoices with paid and outstanding balances }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create invoice in integer paise (administrator)
      responses:
        "201": { description: Invoice created }
        "400": { description: Invalid student, amount or due date }
  /fees/{invoiceId}/payments:
    post:
      security: [{ bearerAuth: [] }]
      summary: Record simulated payment
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeePaymentRequest" }
      responses:
        "201": { description: Payment recorded or idempotent retry acknowledged }
        "403": { description: Invoice is outside guardian/student scope }
        "409": { description: Duplicate key conflict or payment exceeds balance }
  /reports/summary:
    get:
      security: [{ bearerAuth: [] }]
      summary: Attendance, enrollment and fee report
      responses:
        "200": { description: Administrator or teacher-scoped summary }
  /reports/audit:
    get:
      security: [{ bearerAuth: [] }]
      summary: Paginated administrator audit trail
      responses:
        "200": { description: Audit events and page metadata }
        "403": { description: Administrator role required }
